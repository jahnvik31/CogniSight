<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CogniSight · Local setup</title>
<style>body{font:17px/1.6 system-ui,sans-serif;background:#f4f6f8;color:#17293b;margin:0}main{max-width:900px;margin:2rem auto;padding:1.5rem;background:white;border-radius:12px}h1,h2{line-height:1.25}label{display:block;margin-top:1rem;font-weight:600}input:not([type=checkbox]),textarea{display:block;box-sizing:border-box;width:100%;padding:.7rem;font:inherit;border:1px solid #718096;border-radius:5px}button,.button{display:inline-block;background:#184e77;color:white;border:0;padding:.7rem 1rem;border-radius:5px;font:inherit;cursor:pointer;margin:.5rem .5rem .5rem 0;text-decoration:none}.danger{background:#92332c}.notice{background:#fff4d0;padding:.7rem;border-left:4px solid #d39d23}.muted{color:#4f6173}table{border-collapse:collapse;width:100%}td,th{padding:.6rem;text-align:left;border-bottom:1px solid #ddd}nav{display:flex;align-items:center;gap:1rem}.inline{display:inline}ul.errors{color:#92332c}dl{display:grid;grid-template-columns:1fr 2fr}dt{font-weight:600}</style></head>
<body><main><p class="muted">CogniSight · On-device caregiver setup</p>{% for message in get_flashed_messages() %}<p class="notice" role="status">{{ message }}</p>{% endfor %}{% block body %}{% endblock %}<footer><p class="muted">Local enrollment and setup only. Hardware status is reported by the module; this page does not establish recognition accuracy.</p></footer></main></body></html>
