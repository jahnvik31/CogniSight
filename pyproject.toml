[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cognisight"
version = "0.3.0"
description = "Face recognition, spoken introductions, and a caregiver dashboard on a Raspberry Pi"
requires-python = ">=3.9"
dependencies = ["Flask>=3.0,<4"]

[project.optional-dependencies]
# DeepFace brings OpenCV (opencv-contrib-python-headless) and TensorFlow.
# Do not add another OpenCV package: two of them overwrite the same cv2 module.
faces = [
    "deepface>=0.0.93",
    "tf-keras>=2.16,<3",
]
voice = ["moonshine-voice>=0.1.6"]
dev = ["pytest>=8,<9"]

[project.scripts]
cognisight = "cognisight.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
