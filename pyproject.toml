[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cognisight"
version = "0.1.0"
description = "Offline contextual recognition for Raspberry Pi"
requires-python = ">=3.9"
dependencies = ["Flask>=3.0,<4", "Flask-WTF>=1.2,<2", "waitress>=3,<4"]

[project.optional-dependencies]
vision = ["numpy>=1.24,<2", "opencv-python-headless>=4.10,<5"]
audio = ["vosk==0.3.45", "sounddevice>=0.5,<0.6", "piper-tts>=1.3,<2"]
dev = ["pytest>=8,<9"]

[project.scripts]
cognisight = "cognisight.recognition.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"cognisight.recognition" = ["templates/*.html"]
"cognisight.caregiver" = ["templates/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
